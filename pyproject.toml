[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-tool-permission-capability-token"
version = "0.1.0"
description = "Cryptographically signed Macaroon-style capability token system enforcing fine-grained least-privilege tool execution"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
agent-tool-permission-capability-token = "agent_tool_permission_capability_token.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_tool_permission_capability_token*"]
